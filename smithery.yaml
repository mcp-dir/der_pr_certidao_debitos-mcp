# Smithery configuration for DER PR: Certidão Negativa de Débitos (por placa)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_der_pr_certidao_debitos

name: der_pr_certidao_debitos-mcp
displayName: "DER PR: Certidão Negativa de Débitos (por placa)"
description: >
  DER PR: Certidão Negativa de Débitos (por placa), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/der_pr_certidao_debitos-mcp
repository: https://github.com/mcp-dir/der_pr_certidao_debitos-mcp

tags:
  - der_pr_certidao_debitos
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_der_pr_certidao_debitos

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_der_pr_certidao_debitos/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
